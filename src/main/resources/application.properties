spring.application.name=CricHubApi

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/crichub_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=crichub_user
spring.datasource.password=crichub@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8089

# JWT (secret must be at least 256 bits / 32 bytes for HS256)
jwt.secret=crichub-super-secret-jwt-signing-key-change-me-in-prod-2026
jwt.expiration-ms=36000000

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
